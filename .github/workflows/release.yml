name: Release

on:
  push:
    tags:
      - 'v*'

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  # A tag must never produce artefacts that the test suite has not passed.
  # Releasing first and discovering later is how a broken binary gets a
  # signature and a checksum saying it is fine.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Full test suite
        run: go test -race -timeout 20m ./...
        env:
          SHUTDOWNCHECK_REQUIRE_DOCKER: '1'

  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to GHCR
      id-token: write # keyless signing via Sigstore
      attestations: write # SLSA build provenance
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser derives the changelog from history, so a shallow clone
          # would silently produce empty release notes.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@v0

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishing the Homebrew tap and Scoop bucket needs a token that can
          # write to those other repositories, which GITHUB_TOKEN cannot.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      # Provenance is what lets someone prove an artefact came from this
      # workflow at this commit, rather than from a machine that merely claimed
      # to be it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.tar.gz,dist/*.zip,dist/checksums.txt'
