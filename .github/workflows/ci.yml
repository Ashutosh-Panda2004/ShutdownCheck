name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs opt in to more where they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      # The fast pass. Suites that spawn real servers and kill them are
      # excluded here and covered by the conformance job, so a broken unit
      # test is not hidden behind a minute of process wrangling.
      - name: Test
        run: go test -short ./...

      # The race detector needs cgo and a C toolchain. That is reliable on Linux
      # and macOS runners; on Windows it depends on the runner image shipping
      # gcc, so we do not make the build depend on it there.
      - name: Test (race detector)
        if: matrix.os != 'windows-latest'
        run: go test -short -race ./...

  conformance:
    name: conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The servers are driven with real signals, so there is nothing to run
        # on Windows. The tool refuses process targets there rather than
        # pretending, which is asserted in the unit tests instead.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # A missing runtime must not quietly shrink the matrix: the suite would
      # still go green while proving less than it claims.
      - name: Confirm every runtime is present
        run: |
          node --version
          python3 --version

      # Only the Linux runners have a Docker daemon, so that is the only place
      # the containerised run is required rather than skipped.
      - name: Require the docker target on Linux
        if: matrix.os == 'ubuntu-latest'
        run: echo "SHUTDOWNCHECK_REQUIRE_DOCKER=1" >> "$GITHUB_ENV"

      - name: Conformance and end-to-end suites
        run: go test -race -timeout 20m ./test/...

      # Fifty repeated runs of the same fixture, per spec section 19. Only on
      # main: it terminates real processes fifty times and is too slow to put in
      # front of every pull request, but a verdict that is only usually stable
      # is not one anybody can gate a merge on.
      - name: Verdict stability
        if: github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        run: go test ./test/e2e -run TestVerdictIsStableAcrossRepeatedRuns -stability -timeout 30m -v

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out -timeout 20m ./...

      - name: Report total coverage
        run: go tool cover -func=coverage.out | tail -n 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^test/conformance/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.13.2

  tidy:
    name: go.mod tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # govulncheck v1.7.0 requires Go 1.25 or newer. Keep this exact so
          # GOTOOLCHAIN=local remains reproducible while test jobs cover 1.24.
          go-version: '1.26.8'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        run: govulncheck ./...

  # Fuzzing finds the inputs nobody thought to write a test for. A short run on
  # every push keeps the committed corpus honest; the crashers it finds are
  # committed under testdata/fuzz and become ordinary regression tests.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Config parser
        run: go test ./internal/config -run=XXX -fuzz=FuzzParse -fuzztime=60s

      - name: NDJSON timeline parser
        run: go test ./internal/timeline -run=XXX -fuzz=FuzzReadNDJSON -fuzztime=60s

      - name: Report renderers
        run: go test ./internal/report -run=XXX -fuzz=FuzzRenderEveryFormat -fuzztime=60s

      - name: Upload any crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: |
            internal/**/testdata/fuzz/**
          retention-days: 30

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # gosec v2.29.0 requires Go 1.25 or newer.
          go-version: '1.26.8'

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run gosec
        run: gosec -exclude-dir=test/conformance ./...

  # The release config is only exercised when a tag is pushed, which is the
  # worst possible moment to discover it is wrong. A snapshot build here means a
  # broken release pipeline fails on the pull request that broke it.
  release-config:
    name: release config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Match the compiler used by the publishing workflow exactly.
          go-version: '1.26.8'

      - name: Validate .goreleaser.yaml
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.17.0
          args: check

      - name: Snapshot build for every target platform
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.17.0
          # Docker images and signing need a registry and an OIDC token, so the
          # snapshot stops at binaries and archives.
          args: build --snapshot --clean

      - name: Confirm the built binary reports its version
        run: |
          binary=$(find dist -type f -name shutdowncheck -perm -u+x | head -n 1)
          if [ -z "$binary" ]; then
            echo "no linux binary was produced"
            exit 1
          fi
          "$binary" version
