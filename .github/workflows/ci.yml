name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs opt in to more where they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      # The fast pass. Suites that spawn real servers and kill them are
      # excluded here and covered by the conformance job, so a broken unit
      # test is not hidden behind a minute of process wrangling.
      - name: Test
        run: go test -short ./...

      # The race detector needs cgo and a C toolchain. That is reliable on Linux
      # and macOS runners; on Windows it depends on the runner image shipping
      # gcc, so we do not make the build depend on it there.
      - name: Test (race detector)
        if: matrix.os != 'windows-latest'
        run: go test -short -race ./...

  conformance:
    name: conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The servers are driven with real signals, so there is nothing to run
        # on Windows. The tool refuses process targets there rather than
        # pretending, which is asserted in the unit tests instead.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A missing runtime must not quietly shrink the matrix: the suite would
      # still go green while proving less than it claims.
      - name: Confirm every runtime is present
        run: |
          node --version
          python3 --version

      # Only the Linux runners have a Docker daemon, so that is the only place
      # the containerised run is required rather than skipped.
      - name: Require the docker target on Linux
        if: matrix.os == 'ubuntu-latest'
        run: echo "SHUTDOWNCHECK_REQUIRE_DOCKER=1" >> "$GITHUB_ENV"

      - name: Conformance and end-to-end suites
        run: go test -race -timeout 20m ./test/...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out -timeout 20m ./...

      - name: Report total coverage
        run: go tool cover -func=coverage.out | tail -n 1

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^test/conformance/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  tidy:
    name: go.mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec -exclude-dir=test/conformance ./...
