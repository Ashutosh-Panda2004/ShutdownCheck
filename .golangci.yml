version: "2"

linters:
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - revive
    - staticcheck
    - unconvert
    - unused

  settings:
    gosec:
      excludes:
        # G107: shutdowncheck's entire purpose is requesting a user-supplied URL.
        - G107
    revive:
      rules:
        - name: package-comments
        - name: exported
        - name: error-strings
        - name: context-as-argument

  exclusions:
    rules:
      # Each build-tagged implementation returns a constant error state, but
      # the shared caller's contract is intentionally portable across them.
      - path: internal/target/process\.go
        text: SA4023
        linters:
          - staticcheck
      # Test code may ignore errors and use weaker primitives.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx
      # Conformance fixtures are deliberately broken servers; they document
      # anti-patterns and must not be linted into correctness.
      - path: ^test/conformance/
        linters:
          - bodyclose
          - errcheck
          - gocritic
          - gosec
          - noctx
          - revive
          - staticcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/shutdowncheck/shutdowncheck
