name: ShutdownCheck
description: Verify that your service drains in-flight requests correctly when it is terminated
author: shutdowncheck

branding:
  icon: check-circle
  color: purple

inputs:
  version:
    description: Version of shutdowncheck to use, e.g. v1.2.3
    required: true
  url:
    description: URL to send load to during the check
    required: false
  readiness-url:
    description: Readiness endpoint, so SC007 and SC008 can be evaluated
    required: false
  command:
    description: Command argv as a JSON string array, for example ["./api","--port","8080"]
    required: false
  docker:
    description: Name or id of a running container to target instead of a command
    required: false
  config:
    description: Path to a shutdowncheck.yaml
    required: false
  scenario:
    description: Scenario from the config file to run
    required: false
  profile:
    description: "Shutdown profile: auto, standalone, strict, lame-duck, kubernetes, docker"
    required: false
    default: ''
  grace-period:
    description: How long to allow before escalating to SIGKILL
    required: false
  trials:
    description: Number of trials; the worst result across them is the verdict
    required: false
    default: ''
  args:
    description: Extra run arguments as a JSON string array
    required: false
  fail-on-error:
    description: Fail on detected defects. Inconclusive and operational failures always fail.
    required: false
    default: 'true'
  comment-on-pr:
    description: Post or update a single sticky comment on the pull request
    required: false
    default: 'false'
  upload-artifact:
    description: Upload the JSON report as a workflow artifact
    required: false
    default: 'true'
  artifact-name:
    description: Name of the uploaded artifact
    required: false
    default: shutdowncheck-report

outputs:
  verdict:
    description: PASS, FAIL or INCONCLUSIVE
    value: ${{ steps.check.outputs.verdict }}
  score:
    description: Shutdown score from 0 to 100
    value: ${{ steps.check.outputs.score }}
  exit-code:
    description: The tool's exit code, per its documented taxonomy
    value: ${{ steps.check.outputs.exit-code }}
  report-path:
    description: Path to the JSON report on the runner
    value: ${{ steps.check.outputs.report-path }}
  report-written:
    description: Whether a report was produced. False means the run never happened.
    value: ${{ steps.check.outputs.report-written }}

runs:
  using: composite
  steps:
    # Composite rather than a container action so every step is readable here,
    # and so the action adds no image to the supply chain of anyone using it.
    - name: Require a POSIX runner
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "::error::The ShutdownCheck Action requires Linux or macOS because process targets need POSIX signals. Use the CLI's --docker target directly on Windows."
        exit 1

    - name: Verify runner prerequisites
      shell: bash
      run: |
        set -euo pipefail
        command -v curl >/dev/null || { echo "::error::curl is required"; exit 1; }
        command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }

    - name: Validate inputs
      shell: bash
      env:
        IN_VERSION: ${{ inputs.version }}
        IN_COMMAND: ${{ inputs.command }}
        IN_ARGS: ${{ inputs.args }}
        IN_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        IN_COMMENT: ${{ inputs.comment-on-pr }}
        IN_UPLOAD: ${{ inputs.upload-artifact }}
        IN_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        set -euo pipefail

        if [ -z "$IN_VERSION" ] || [ "$IN_VERSION" = "latest" ]; then
          echo "::error::version is required and must be an exact release such as v1.2.3"
          exit 3
        fi

        validate_bool() {
          case "$2" in
            true|false) ;;
            *) echo "::error::$1 must be either true or false"; exit 3 ;;
          esac
        }
        validate_bool fail-on-error "$IN_FAIL_ON_ERROR"
        validate_bool comment-on-pr "$IN_COMMENT"
        validate_bool upload-artifact "$IN_UPLOAD"

        validate_array() {
          if [ -n "$2" ] && ! jq -e 'type == "array" and all(.[]; type == "string")' >/dev/null <<< "$2"; then
            echo "::error::$1 must be a JSON array of strings"
            exit 3
          fi
        }
        validate_array command "$IN_COMMAND"
        validate_array args "$IN_ARGS"

        if [ "$IN_UPLOAD" = "true" ] && [ -z "$IN_ARTIFACT_NAME" ]; then
          echo "::error::artifact-name must not be empty when upload-artifact is true"
          exit 3
        fi

    - name: Install shutdowncheck
      shell: bash
      env:
        SHUTDOWNCHECK_VERSION: ${{ inputs.version }}
        SHUTDOWNCHECK_BIN_DIR: ${{ runner.temp }}/shutdowncheck-bin
      run: |
        set -euo pipefail
        # Use the installer from the pinned Action revision, not a moving branch.
        sh "$GITHUB_ACTION_PATH/install.sh"
        echo "${{ runner.temp }}/shutdowncheck-bin" >> "$GITHUB_PATH"

    - name: Run shutdowncheck
      id: check
      shell: bash
      env:
        IN_URL: ${{ inputs.url }}
        IN_READINESS_URL: ${{ inputs.readiness-url }}
        IN_COMMAND: ${{ inputs.command }}
        IN_DOCKER: ${{ inputs.docker }}
        IN_CONFIG: ${{ inputs.config }}
        IN_SCENARIO: ${{ inputs.scenario }}
        IN_PROFILE: ${{ inputs.profile }}
        IN_GRACE: ${{ inputs.grace-period }}
        IN_TRIALS: ${{ inputs.trials }}
        IN_ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail

        report="${RUNNER_TEMP}/shutdowncheck-report.json"
        summary="${RUNNER_TEMP}/shutdowncheck-summary.md"
        rm -f "$report" "$summary"

        # The JSON must come from the original run. Re-analysing NDJSON would
        # intentionally allow a different profile and could lose custom gates.
        args=(run --format json --output "$report" --no-color)

        add_flag() { if [ -n "$2" ]; then args+=("$1" "$2"); fi; }
        add_flag --url            "$IN_URL"
        add_flag --readiness-url  "$IN_READINESS_URL"
        add_flag --docker         "$IN_DOCKER"
        add_flag --config         "$IN_CONFIG"
        add_flag --scenario       "$IN_SCENARIO"
        add_flag --profile        "$IN_PROFILE"
        add_flag --grace-period   "$IN_GRACE"
        add_flag --trials         "$IN_TRIALS"

        append_json_array() {
          local label="$1" json="$2" item
          if [ -z "$json" ]; then
            return
          fi
          if ! jq -e 'type == "array" and all(.[]; type == "string")' >/dev/null <<< "$json"; then
            echo "::error::$label must be a JSON array of strings"
            exit 3
          fi
          while IFS= read -r item; do
            args+=("$item")
          done < <(jq -r '.[]' <<< "$json")
        }

        if [ -n "$IN_ARGS" ]; then
          append_json_array args "$IN_ARGS"
        fi
        if [ -n "$IN_COMMAND" ]; then
          args+=(--)
          append_json_array command "$IN_COMMAND"
        fi

        shutdowncheck "${args[@]}" > /dev/null
        code=$?
        {
          echo "exit-code=$code"
          echo "report-path=$report"
        } >> "$GITHUB_OUTPUT"

        # Exit codes 3, 4 and 5 mean the tool never completed the experiment.
        # There is no report to publish, and inventing one would be worse.
        if [ ! -s "$report" ]; then
          {
            echo "verdict=INCONCLUSIVE"
            echo "score="
            echo "report-written=false"
          } >> "$GITHUB_OUTPUT"
          echo "::error::shutdowncheck could not complete the run (exit $code)"
          exit "$code"
        fi

        if ! jq -e '
          (.verdict == "PASS" or .verdict == "FAIL" or .verdict == "INCONCLUSIVE") and
          (.score.value | type == "number")
        ' "$report" >/dev/null; then
          {
            echo "verdict=INCONCLUSIVE"
            echo "score="
            echo "report-written=false"
          } >> "$GITHUB_OUTPUT"
          echo "::error::shutdowncheck produced an invalid JSON report"
          exit 5
        fi

        verdict=$(jq -r '.verdict // "UNKNOWN"' "$report")
        score=$(jq -r '.score.value // empty' "$report")
        {
          echo "verdict=$verdict"
          echo "score=$score"
          echo "report-written=true"
        } >> "$GITHUB_OUTPUT"

        {
          printf '## ShutdownCheck: %s\n\n' "$verdict"
          printf '**Score %s/100**\n\n' "$score"
          jq -r '
            if (.findings | length) == 0 then
              "No shutdown defects were detected."
            else
              "| Severity | Finding | Summary |\n| --- | --- | --- |\n" +
              ([.findings[] | "| \(.severity) | `\(.id)` \(.name) | \(.summary | gsub("\\|"; "\\\\|")) |"] | join("\n"))
            end
          ' "$report"
        } > "$summary"

        cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        exit "$code"
      continue-on-error: true

    - name: Upload the report
      # Gated on an explicit output rather than hashFiles, which only resolves
      # paths under the workspace and would silently never match here.
      if: inputs.upload-artifact == 'true' && steps.check.outputs.report-written == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/shutdowncheck-report.json
        retention-days: 30

    - name: Comment on the pull request
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' && steps.check.outputs.report-written == 'true'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      env:
        VERDICT: ${{ steps.check.outputs.verdict }}
        SCORE: ${{ steps.check.outputs.score }}
      with:
        script: |
          const fs = require('fs');
          const path = `${process.env.RUNNER_TEMP}/shutdowncheck-summary.md`;
          const body = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'ShutdownCheck produced no report.';

          // A marker so repeated runs update one comment instead of burying the
          // pull request in a new one per push.
          const marker = '<!-- shutdowncheck-report -->';
          const content = `${marker}\n${body}`;

          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          const existing = await github.paginate(github.rest.issues.listComments, {
            owner, repo, issue_number, per_page: 100
          });
          const previous = existing.find(c => c.body && c.body.includes(marker));

          if (previous) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body: content });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body: content });
          }

    - name: Apply the result
      shell: bash
      env:
        CODE: ${{ steps.check.outputs.exit-code }}
        VERDICT: ${{ steps.check.outputs.verdict }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        set -euo pipefail
        echo "verdict: ${VERDICT:-unknown} (exit ${CODE:-unknown})"
        case "$FAIL_ON_ERROR" in
          true|false) ;;
          *) echo "::error::fail-on-error must be either true or false"; exit 3 ;;
        esac

        # fail-on-error controls findings only. Inconclusive and operational
        # failures cannot be converted into a green check.
        if [ "${CODE:-5}" -ge 2 ]; then
          exit "${CODE:-5}"
        fi
        if [ "$FAIL_ON_ERROR" != "true" ]; then
          echo "fail-on-error is false, so the result is reported but not gated"
          exit 0
        fi
        exit "${CODE:-1}"
